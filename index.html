*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Jost,system-ui,sans-serif;color:var(--ink);background:var(--bg);font-size:15px;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
img{display:block;max-width:100%}
.notice{background:var(--ink);color:#fff;text-align:center;padding:9px 12px;font-size:13px;letter-spacing:.06em}
header{position:sticky;top:0;z-index:20;background:#fffffff2;backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0)}
.hd{max-width:1280px;margin:auto;display:flex;align-items:center;gap:12px;padding:12px 16px}
.logo{font-family:'Playfair Display',serif;font-size:26px;letter-spacing:.14em;flex:1;text-align:center;font-weight:600}
.hd .side{flex:1;display:flex;gap:6px}.hd .side.r{justify-content:flex-end}
.ib{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;position:relative;font-size:19px}
.ib:hover{background:var(--soft)}
.badge{position:absolute;top:2px;right:0;background:var(--gold);color:#fff;font-size:10px;min-width:17px;height:17px;border-radius:9px;display:grid;place-items:center}
.sb{display:none;max-width:1280px;margin:auto;padding:0 16px 12px}.sb.on{display:block}
.sb input{width:100%;padding:11px 14px;border:1px solid var(--line);border-radius:4px;background:var(--soft)}
.hero{position:relative;min-height:56vh;max-height:620px;background:var(--soft) center/cover;display:flex;align-items:flex-end}
.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 40%,#0006)}
.hero div{position:relative;z-index:1;color:#fff;padding:32px clamp(16px,5vw,64px);max-width:640px}
.hero h1{font-family:'Playfair Display',serif;font-size:clamp(30px,6vw,58px);font-weight:500;line-height:1.1}
.hero p{margin:10px 0 18px;font-weight:300;font-size:17px}
.btn{background:var(--ink);color:#fff;padding:13px 26px;font-weight:500;letter-spacing:.04em;border-radius:2px;transition:.2s}
.btn:hover{background:var(--gold)}.btn.o{background:none;color:var(--ink);border:1px solid var(--ink)}.btn.o:hover{background:var(--ink);color:#fff}
.btn.w{width:100%}.btn.sm{padding:8px 14px;font-size:13px}.btn.red{background:var(--red)}
.wrap{max-width:1280px;margin:auto;padding:0 16px}
.cats{display:flex;gap:8px;overflow-x:auto;padding:22px 0 8px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cats button{white-space:nowrap;padding:9px 20px;border:1px solid var(--line);border-radius:30px;font-size:14px;transition:.15s}
.cats button.on,.cats button:hover{background:var(--ink);color:#fff;border-color:var(--ink)}
h2.t{font-family:'Playfair Display',serif;font-weight:500;font-size:26px;margin:22px 0 14px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:22px 12px}
@media(min-width:700px){.grid{grid-template-columns:repeat(3,1fr);gap:28px 16px}}
@media(min-width:1050px){.grid{grid-template-columns:repeat(4,1fr)}}
.card{cursor:pointer}
.card .im{aspect-ratio:3/4;background:var(--soft);overflow:hidden;position:relative}
.card img{width:100%;height:100%;object-fit:cover;transition:.4s}
.card .im img+img{position:absolute;inset:0;opacity:0}
.card:hover .im img+img{opacity:1}
.card h3{font-weight:400;font-size:14px;margin-top:10px;text-transform:uppercase;letter-spacing:.03em;color:#4a4740}
.pr{margin-top:4px;font-weight:500}.pr s{color:var(--mute);font-weight:300;margin-left:6px;font-size:13px}
.rt{font-size:12px;color:var(--gold);margin-top:2px}
.tag{position:absolute;top:8px;left:8px;background:#fff;font-size:11px;padding:3px 8px;letter-spacing:.05em;z-index:1}
.empty{padding:60px 16px;text-align:center;color:var(--mute);grid-column:1/-1}
footer{background:var(--soft);margin-top:70px;padding:44px 16px 90px;border-top:1px solid var(--line)}
.fg{max-width:1280px;margin:auto;display:grid;gap:30px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
footer h4{font-family:'Playfair Display',serif;font-weight:500;margin-bottom:12px;font-size:18px}
footer a,footer p{display:block;color:#5b574f;margin:7px 0;font-size:14px;text-decoration:none;cursor:pointer}
footer a:hover{color:var(--gold)}
.copy{max-width:1280px;margin:30px auto 0;padding-top:18px;border-top:1px solid var(--line);color:var(--mute);font-size:13px;text-align:center}
.float{position:fixed;right:14px;bottom:calc(16px + env(safe-area-inset-bottom,0));z-index:15;background:#25d366;color:#fff;border-radius:30px;padding:12px 18px;font-weight:500;box-shadow:0 6px 18px #0003;text-decoration:none}
#ov{position:fixed;inset:0;background:#0007;z-index:40;display:none}#ov.on{display:block}
#sh{position:fixed;z-index:41;background:#fff;display:none;overflow:auto;bottom:0;left:0;right:0;max-height:92vh;border-radius:14px 14px 0 0;padding:20px 18px calc(24px + env(safe-area-inset-bottom,0));animation:up .25s}
#sh.on{display:block}
@media(min-width:800px){#sh{left:50%;right:auto;bottom:auto;top:50%;transform:translate(-50%,-50%);width:min(880px,94vw);border-radius:8px;animation:none}#sh.n{width:min(480px,94vw)}}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.x{position:absolute;top:10px;right:12px;font-size:26px;width:36px;height:36px}
.pd{display:grid;gap:20px}@media(min-width:800px){.pd{grid-template-columns:1fr 1fr}}
.pd .main{aspect-ratio:3/4;width:100%;object-fit:cover;background:var(--soft)}
.th{display:flex;gap:8px;margin-top:8px;overflow-x:auto}.th img{width:56px;height:72px;object-fit:cover;cursor:pointer;border:1px solid var(--line)}
.opt{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 16px}
.opt button{min-width:46px;padding:9px 14px;border:1px solid var(--line);border-radius:2px}
.opt button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.opt button:disabled{color:#bbb;text-decoration:line-through;cursor:not-allowed}
.lb{font-size:13px;color:var(--mute);margin-top:4px}
.ci{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.ci img{width:64px;height:84px;object-fit:cover}.ci div{flex:1;font-size:14px}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line);margin-top:6px}.qty button{width:30px;height:30px}.qty span{min-width:28px;text-align:center}
.row{display:flex;justify-content:space-between;padding:6px 0}.row.b{font-weight:600;font-size:18px;border-top:1px solid var(--ink);margin-top:8px;padding-top:12px}
.f{display:block;margin:12px 0 4px;font-size:13px;color:var(--mute)}
input.i,select.i,textarea.i{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:3px;background:#fff}
input.i:focus,textarea.i:focus,select.i:focus{outline:2px solid var(--gold);outline-offset:-1px}
.zone{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.zone label{border:1px solid var(--line);padding:12px;border-radius:3px;cursor:pointer;font-size:14px}
.zone input{display:none}.zone label:has(input:checked){border-color:var(--ink);background:var(--soft)}
.toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 20px;border-radius:30px;z-index:60;font-size:14px}
/* admin */
.ad{max-width:1100px;margin:auto;padding:16px 16px 80px}
.tabs{display:flex;gap:6px;overflow-x:auto;margin:14px 0;border-bottom:1px solid var(--line)}
.tabs button{padding:11px 18px;white-space:nowrap;color:var(--mute)}.tabs button.on{color:var(--ink);border-bottom:2px solid var(--ink);font-weight:500}
.al{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.al img{width:48px;height:62px;object-fit:cover;background:var(--soft)}.al .g{flex:1;font-size:14px;min-width:0}
.al .g small{color:var(--mute);display:block}
.pill{display:inline-block;padding:2px 9px;border-radius:12px;font-size:12px;background:var(--soft)}
.pill.g1{background:#e3f4e6;color:#1f7a34}.pill.r1{background:#fbe4e1;color:var(--red)}.pill.y{background:#fdf2d9;color:#8a6410}
.fr{display:grid;gap:0 14px}@media(min-width:700px){.fr{grid-template-columns:1fr 1fr}}
.up{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}.up div{position:relative}.up img{width:70px;height:90px;object-fit:cover;border:1px solid var(--line)}
.up b{position:absolute;top:-6px;right:-6px;background:var(--red);color:#fff;width:20px;height:20px;border-radius:50%;text-align:center;font-size:13px;cursor:pointer}
.box{background:var(--soft);padding:16px;border-radius:6px;margin:14px 0}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}.stats div{background:var(--soft);padding:14px;border-radius:6px}.stats b{font-size:24px;display:block}

#splash{position:fixed;inset:0;z-index:100;background:#fff;display:grid;place-items:center;transition:opacity .6s,visibility .6s;cursor:pointer}
#splash.hide{opacity:0;visibility:hidden}
#splash .lg{position:relative;width:min(78vw,440px);aspect-ratio:1060/680}
#splash .lg i{position:absolute;inset:0;background:var(--logo) center/100% 100% no-repeat}
#splash .c{clip-path:inset(0 0 44.4% 0);animation:crown .8s cubic-bezier(.2,.9,.3,1.2) both}
#splash .t{clip-path:inset(55.6% 0 0 0);animation:wipe .9s .55s cubic-bezier(.6,0,.2,1) both}
@keyframes crown{from{transform:translateY(-46px);opacity:0}to{transform:none;opacity:1}}
@keyframes wipe{from{clip-path:inset(55.6% 100% 0 0)}to{clip-path:inset(55.6% 0 0 0)}}
@media(prefers-reduced-motion:reduce){#splash .lg i{animation:none}}

.notice{background:#111;color:#e7d7b8;border-bottom:1px solid var(--gold)}

<script>

policies:[{t:'Privacy Policy',c:'Write your privacy policy here.'},{t:'Return & Refund',c:'Write your return policy here.'},{t:'Terms & Conditions',c:'Write your terms here.'},{t:'Delivery Info',c:'Inside Dhaka 1-2 days, outside Dhaka 3-5 days.'}]};

const S={set:DEF,cats:[],prods:[],cat:'',q:'',n:24,cart:LS.g('cart',[]),admin:false,tab:'p',sel:{}};
const tot=p=>(p.sizes||[]).reduce((a,s)=>a+(+s.q||0),0),out=p=>p.out||tot(p)<=0;

async function boot(){try{S.set={...DEF,...await DB.set()};S.cats=await DB.list('cats');S.prods=await DB.prods(S.n,S.cat)}catch(e){console.error(e);toast('Could not load data. Check Firebase config.')}
document.title=S.set.brand;route()}

/* ===== STOREFRONT ===== */
function store(){const s=S.set,cnt=S.cart.reduce((a,c)=>a+c.qty,0),q=S.q.toLowerCase(),list=S.prods.filter(p=>!q||p.name.toLowerCase().includes(q));
const soc=[['fb','Facebook'],['ig','Instagram'],['tt','TikTok']].filter(x=>s[x[0]]).map(x=>`<a href="${esc(s[x[0]])}" target="_blank" rel="noopener">${x[1]}</a>`).join('');
$('#app').innerHTML=`${s.noticeOn&&s.notice?`<div class="notice">${esc(s.notice)}</div>`:''}
<header><div class="hd"><div class="side"><button class="ib" onclick="$('.sb').classList.toggle('on');$('.sb input').focus()" aria-label="Search">⌕</button></div><div class="logo" onclick="S.cat='';S.q='';S.n=24;reload()" style="cursor:pointer">${esc(s.brand)}</div><div class="side r"><button class="ib" onclick="cartView()" aria-label="Cart">🛍<span class="badge" ${cnt?'':'hidden'}>${cnt}</span></button></div></div>
<div class="sb ${S.q?'on':''}"><input placeholder="Search products" value="${esc(S.q)}" oninput="S.q=this.value;grid()"></div></header>
<div class="hero" style="${s.heroImg?`background-image:url(${s.heroImg})`:''}"><div><h1>${esc(s.heroT)}</h1><p>${esc(s.heroS)}</p><button class="btn" onclick="$('#gr').scrollIntoView({behavior:'smooth'})">${esc(s.heroBtn)}</button></div></div>
<div class="wrap"><div class="cats"><button class="${S.cat?'':'on'}" onclick="pick('')">All</button>${S.cats.map(c=>`<button class="${S.cat==c.name?'on':''}" onclick="pick('${esc(c.name).replace(/'/g,"\\'")}')">${esc(c.name)}</button>`).join('')}</div>
<h2 class="t" id="gr">${S.cat||'New arrivals'}</h2><div class="grid" id="grid"></div><div style="text-align:center;margin-top:30px" id="more"></div></div>
<footer><div class="fg"><div><h4>${esc(s.brand)}</h4><p>${esc(s.about)}</p></div>
<div><h4>Customer support</h4><a href="tel:${esc(s.hotline)}">Hotline: ${esc(s.hotline)}</a><a href="https://wa.me/${esc(s.whatsapp)}" target="_blank">WhatsApp us</a></div>
<div><h4>Policies</h4>${(s.policies||[]).map((p,i)=>`<a onclick="policy(${i})">${esc(p.t)}</a>`).join('')}</div>
<div><h4>Official payment</h4><p>bKash (Personal): <b>${esc(s.bkash)}</b></p><p>Nagad (Personal): <b>${esc(s.nagad)}</b></p><div style="margin-top:10px">${soc}</div></div></div>
<div class="copy">© ${new Date().getFullYear()} ${esc(s.brand)}. All rights reserved.</div></footer>
<a class="float" href="https://wa.me/${esc(s.whatsapp)}" target="_blank">WhatsApp</a>`;grid()}
function grid(){const q=S.q.toLowerCase(),l=S.prods.filter(p=>!q||p.name.toLowerCase().includes(q));
$('#grid').innerHTML=l.length?l.map(p=>{const i=p.imgs||[];return`<div class="card" onclick="view('${p.id}')"><div class="im">${out(p)?'<span class="tag">Sold out</span>':''}<img src="${i[0]||''}" alt="${esc(p.name)}" loading="lazy">${i[1]?`<img src="${i[1]}" loading="lazy" alt="">`:''}</div><h3>${esc(p.name)}</h3><div class="pr">${tk(p.price)}${p.old>p.price?`<s>${tk(p.old)}</s>`:''}</div>${p.rating?`<div class="rt">★ ${p.rating}</div>`:''}</div>`}).join(''):'<div class="empty">No products available right now. Please check back soon.</div>';
$('#more').innerHTML=S.prods.length>=S.n?'<button class="btn o" onclick="S.n+=24;reload()">Load more</button>':''}
async function reload(){S.prods=await DB.prods(S.n,S.cat);store();}
function pick(c){S.cat=c;S.n=24;reload()}
function policy(i){const p=S.set.policies[i];sheet(`<h2 class="t" style="margin-top:0">${esc(p.t)}</h2><p style="white-space:pre-wrap;line-height:1.7">${esc(p.c)}</p>`,1)}
function view(id){const p=S.prods.find(x=>x.id==id);S.sel={id,size:'',color:'',qty:1};const im=p.imgs||[];
sheet(`<div class="pd"><div><img class="main" id="mi" src="${im[0]||''}" alt=""><div class="th">${im.map(u=>`<img src="${u}" onclick="$('#mi').src=this.src" alt="">`).join('')}</div></div>
<div><div class="sku">CODE ${p.id.slice(-6).toUpperCase()}</div><h2 class="t" style="margin-top:6px">${esc(p.name)}</h2><div class="pr" style="font-size:20px">${tk(p.price)}${p.old>p.price?`<s>${tk(p.old)}</s>`:''}</div>${p.rating?`<div class="rt">★ ${p.rating}</div>`:''}
<div class="lb" style="margin-top:16px">Size</div><div class="opt">${(p.sizes||[]).map(s=>`<button ${+s.q>0&&!p.out?'':'disabled'} onclick="S.sel.size='${esc(s.n)}';pk(this)">${esc(s.n)}${+s.q>0&&+s.q<=3?` <small>(${s.q} left)</small>`:''}</button>`).join('')||'<span class="lb">Out of stock</span>'}</div>
${p.useColors&&p.colors?.length?`<div class="lb">Color</div><div class="opt">${p.colors.map(c=>`<button onclick="S.sel.color='${esc(c)}';pk(this)">${esc(c)}</button>`).join('')}</div>`:''}
<button class="btn w" ${out(p)?'disabled':''} onclick="addCart('${p.id}')">${out(p)?'Sold out':'Add to cart'}</button>
<div style="margin-top:8px">${info(p)}</div></div></div>`)}
const steps=n=>`<div class="stp">${['Cart','Details','Review'].map((x,i)=>`<span class="${i<n?'on':''}">${i+1}. ${x}</span>`).join('')}</div>`;
function info(p){const d=(p.desc||'').split('\n').map(x=>x.trim()).filter(Boolean),bl=d.filter(x=>/^[-•*]/.test(x)),tx=d.filter(x=>!/^[-•*]/.test(x)),sp=[['Fabric',p.fabric],['Fit',p.fit],['Care',p.care]].filter(x=>x[1]);
return(p.note?`<div class="nt">${esc(p.note)}</div>`:'')+(d.length?`<details open><summary>Product details</summary>${tx.map(x=>`<p>${esc(x)}</p>`).join('')}${bl.length?`<ul>${bl.map(x=>`<li>${esc(x.replace(/^[-•*]\s*/,''))}</li>`).join('')}</ul>`:''}</details>`:'')+(sp.length?`<details open><summary>Fabric &amp; care</summary><div class="spec">${sp.map(x=>`<span>${x[0]}</span><b>${esc(x[1])}</b>`).join('')}</div></details>`:'')+`<details><summary>Delivery &amp; order</summary><p>Inside Dhaka ${tk(S.set.dIn)}, outside Dhaka ${tk(S.set.dOut)}. After you place the order, we confirm it with you on WhatsApp.</p></details>`}
function pk(b){[...b.parentNode.children].forEach(x=>x.classList.remove('on'));b.classList.add('on')}
function addCart(id){const p=S.prods.find(x=>x.id==id);if(!S.sel.size)return toast('Please select a size');if(p.useColors&&p.colors?.length&&!S.sel.color)return toast('Please select a color');
const k=id+S.sel.size+S.sel.color,e=S.cart.find(c=>c.k==k);e?e.qty++:S.cart.push({k,pid:id,name:p.name,price:p.price,img:(p.imgs||[])[0]||'',size:S.sel.size,color:S.sel.color,qty:1});LS.s('cart',S.cart);store();cartView()}
function cartView(){const sub=S.cart.reduce((a,c)=>a+c.price*c.qty,0);
sheet(`${steps(1)}<h2 class="t" style="margin-top:0">Your cart</h2>${S.cart.length?S.cart.map((c,i)=>`<div class="ci"><img src="${c.img}" alt=""><div>${esc(c.name)}<div class="lb">Size ${esc(c.size)}${c.color?' · '+esc(c.color):''}</div><div class="qty"><button onclick="qt(${i},-1)">−</button><span>${c.qty}</span><button onclick="qt(${i},1)">+</button></div></div><b>${tk(c.price*c.qty)}</b></div>`).join('')+`<div class="row b"><span>Subtotal</span><span>${tk(sub)}</span></div><button class="btn w" style="margin-top:14px" onclick="info()">Checkout</button>`:'<div class="empty">Your cart is empty.</div>'}`,1)}
function qt(i,d){S.cart[i].qty+=d;if(S.cart[i].qty<1)S.cart.splice(i,1);LS.s('cart',S.cart);store();cartView()}
let CU=LS.g('cust',{name:'',phone:'',addr:'',area:'in'});
function info(){sheet(`${steps(2)}<h2 class="t" style="margin-top:0">Delivery details</h2><label class="f">Full name</label><input class="i" id="cn" value="${esc(CU.name)}"><label class="f">Phone number</label><input class="i" id="cp" type="tel" inputmode="numeric" placeholder="01XXXXXXXXX" value="${esc(CU.phone)}"><label class="f">Full address</label><textarea class="i" id="ca" rows="3">${esc(CU.addr)}</textarea><label class="f">Delivery area</label>
<div class="zone"><label><input type="radio" name="z" value="in" ${CU.area=='in'?'checked':''}>Inside Dhaka<br><b>${tk(S.set.dIn)}</b></label><label><input type="radio" name="z" value="out" ${CU.area=='out'?'checked':''}>Outside Dhaka<br><b>${tk(S.set.dOut)}</b></label></div><button class="btn w" style="margin-top:18px" onclick="review()">Review order</button>`,1)}
function review(){const n=$('#cn').value.trim(),p=$('#cp').value.trim(),a=$('#ca').value.trim(),z=document.querySelector('[name=z]:checked').value;
if(n.length<2)return toast('Enter your name');if(!/^01\d{9}$/.test(p))return toast('Enter a valid 11-digit phone number');if(a.length<8)return toast('Enter your full address');
CU={name:n,phone:p,addr:a,area:z};LS.s('cust',CU);const sub=S.cart.reduce((x,c)=>x+c.price*c.qty,0),ship=+(z=='in'?S.set.dIn:S.set.dOut);
sheet(`${steps(3)}<h2 class="t" style="margin-top:0">Review your order</h2>${S.cart.map(c=>`<div class="row"><span>${esc(c.name)} (${esc(c.size)}${c.color?', '+esc(c.color):''}) × ${c.qty}</span><span>${tk(c.price*c.qty)}</span></div>`).join('')}
<div class="row"><span>Subtotal</span><span>${tk(sub)}</span></div><div class="row"><span>Delivery (${z=='in'?'Inside':'Outside'} Dhaka)</span><span>${tk(ship)}</span></div><div class="row b"><span>Total</span><span>${tk(sub+ship)}</span></div>
<div class="box" style="font-size:14px;line-height:1.6"><b>${esc(n)}</b> · ${esc(p)}<br>${esc(a)}</div><p class="lb">After you confirm, WhatsApp opens so we can confirm your order with you.</p>
<button class="btn w" style="margin-top:14px" onclick="place(${sub},${ship})">Confirm order</button><button class="btn o w" style="margin-top:8px" onclick="info()">Edit details</button>`,1)}
const thumb=s=>new Promise(r=>{if(!s)return r('');const i=new Image;i.onload=()=>{const k=110/Math.max(i.width,i.height),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);r(c.toDataURL('image/jpeg',.6))};i.onerror=()=>r('');i.src=s});
async function place(sub,ship){const U=location.origin+location.pathname,th=await Promise.all(S.cart.map(c=>thumb(c.img)));const o={...CU,items:S.cart.map(({pid,name,size,color,qty,price},k)=>({pid,name,size,color,qty,price,img:th[k]})),sub,ship,total:sub+ship,status:'pending',ts:Date.now()};

S.cart=[];LS.s('cart',[]);location.href=`https://wa.me/${S.set.whatsapp}?text=${encodeURIComponent(m)}`}

async function admin(){if(LIVE){if(!auth.currentUser)await new Promise(r=>auth.onAuthStateChanged(r))}else S.admin=S.admin||sessionStorage.a=='1';
S.admin=LIVE?!!auth.currentUser:S.admin;if(!S.admin)return login();S.prods=await DB.prods(300,'');adm()}

async function adm(){const t=S.tab;let b='';
if(t=='p')b=`<div style="display:flex;gap:8px;justify-content:space-between;align-items:center"><span class="lb">${S.prods.length} / ${MAXP} products</span><button class="btn sm" onclick="pForm()">+ Add product</button></div>`+(S.prods.map(p=>`<div class="al"><img src="${(p.imgs||[])[0]||''}" alt=""><div class="g">${esc(p.name)}<small>${tk(p.price)} · ${esc(p.cat||'No category')}</small></div><span class="pill ${out(p)?'r1':'g1'}">${out(p)?'Sold out':tot(p)+' pcs'}</span><button class="btn o sm" onclick="tgl('${p.id}')">${p.out?'Restock':'Sold out'}</button>${p.hide?'<span class="pill">Hidden</span>':''}<button class="btn o sm" onclick="pForm('${p.id}')">Edit</button></div>`).join('')||'<div class="empty">No products yet.</div>');
if(t=='c')b=`<div style="display:flex;gap:8px"><input class="i" id="nc" placeholder="Category name"><button class="btn sm" onclick="addCat()">Add</button></div><p class="lb">${S.cats.length} / ${MAXC} categories</p>`+S.cats.map(c=>`<div class="al"><div class="g">${esc(c.name)}</div><button class="btn o sm" onclick="delCat('${c.id}')">Delete</button></div>`).join('');
if(t=='o'){const os=await DB.orders();const rev=os.filter(o=>o.status=='confirmed'||o.status=='delivered').reduce((a,o)=>a+o.total,0);
b=`<div class="stats"><div><b>${os.length}</b>Orders</div><div><b>${os.filter(o=>o.status=='pending').length}</b>Pending</div><div><b>${tk(rev)}</b>Confirmed sales</div></div>`+os.map(o=>`<div class="box"><div style="display:flex;justify-content:space-between"><b>#${o.id.slice(-6).toUpperCase()}</b><span class="pill ${o.status=='pending'?'y':o.status=='cancelled'?'r1':'g1'}">${o.status}</span></div><div style="font-size:14px;line-height:1.6;margin:8px 0">${o.items.map(i=>`<a href="#p=${i.pid}" target="_blank" style="display:flex;gap:8px;align-items:center;margin:4px 0;color:inherit;text-decoration:none">${i.img?`<img src="${i.img}" style="width:44px;height:56px;object-fit:cover" alt="">`:''}<span>${esc(i.name)} (${esc(i.size)}${i.color?', '+esc(i.color):''}) × ${i.qty}</span></a>`).join('')}<b>${tk(o.total)}</b> (delivery ${tk(o.ship)}, ${o.area=='in'?'Inside':'Outside'} Dhaka)<br>${esc(o.name)} · <a href="https://wa.me/88${esc(o.phone)}" target="_blank">${esc(o.phone)}</a><br>${esc(o.addr)}</div>
${o.status=='pending'?`<button class="btn sm" onclick="ost('${o.id}','confirmed')">Confirm &amp; cut stock</button> <button class="btn o sm" onclick="ost('${o.id}','cancelled')">Cancel</button>`:''}${o.status=='confirmed'?`<button class="btn sm" onclick="ost('${o.id}','delivered')">Mark delivered</button>`:''} <button class="btn o sm" onclick="if(confirm('Delete order?'))DB.del('orders','${o.id}').then(adm)">Delete</button></div>`).join('')||'<div class="empty">No orders yet.</div>'}
if(t=='s')b=setForm();
$('#app').innerHTML=`<div class="ad"><div style="display:flex;justify-content:space-between;align-items:center"><h2 class="t" style="margin:0">Admin panel</h2><div><a class="btn o sm" href="#" style="text-decoration:none">View store</a> <button class="btn o sm" onclick="logout()">Log out</button></div></div>
<div class="tabs">${[['p','Products'],['c','Categories'],['o','Orders'],['s','Settings']].map(x=>`<button class="${t==x[0]?'on':''}" onclick="S.tab='${x[0]}';adm()">${x[1]}</button>`).join('')}</div>${b}</div>`}
async function addCat(){const n=$('#nc').value.trim();if(!n)return;if(S.cats.length>=MAXC)return toast('Category limit reached (120)');await DB.save('cats',{name:n});S.cats=await DB.list('cats');adm()}
async function delCat(id){if(!confirm('Delete category?'))return;await DB.del('cats',id);S.cats=await DB.list('cats');adm()}
async function ost(id,st){const o=await DB.get('orders',id);if(st=='confirmed'){for(const i of o.items){const p=await DB.get('products',i.pid);if(!p)continue;const s=p.sizes.find(x=>x.n==i.size);if(s)s.q=Math.max(0,(+s.q||0)-i.qty);await DB.save('products',p)}}
o.status=st;await DB.save('orders',o);S.prods=await DB.prods(300,'');adm()}
let IM=[];
function pForm(id){const p=id?S.prods.find(x=>x.id==id):{name:'',price:'',old:'',cat:'',desc:'',rating:'4.5',colors:[],useColors:false,sizes:[{n:'M',q:10}],imgs:[]};if(!id&&S.prods.length>=MAXP)return toast('Product limit reached (3000)');IM=[...(p.imgs||[])];
sheet(`<h2 class="t" style="margin-top:0">${id?'Edit':'Add'} product</h2><div class="fr"><div><label class="f">Name</label><input class="i" id="pn" value="${esc(p.name)}"></div><div><label class="f">Category</label><select class="i" id="pc"><option value="">None</option>${S.cats.map(c=>`<option ${c.name==p.cat?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div><div><label class="f">Price (৳)</label><input class="i" id="pp" type="number" value="${p.price}"></div><div><label class="f">Old price (optional)</label><input class="i" id="po" type="number" value="${p.old||''}"></div><div><label class="f">Rating (0-5)</label><input class="i" id="pr" type="number" step=".1" max="5" value="${p.rating||''}"></div></div>
<label class="f">Sizes &amp; stock (example: S=10, M=5, L=0)</label><input class="i" id="ps" value="${(p.sizes||[]).map(s=>s.n+'='+s.q).join(', ')}">
<label class="f"><input type="checkbox" id="pu" ${p.useColors?'checked':''}> Enable colors</label><input class="i" id="pl" placeholder="Red, Navy, Black" value="${esc((p.colors||[]).join(', '))}">
<label class="f">Description (tip: start a line with - to make a bullet point)</label><textarea class="i" id="pd" rows="5" placeholder="Write a short intro line about the product.
- Premium quality fabric
- Comfortable regular fit
- Perfect for Eid and festive wear">${esc(p.desc)}</textarea>
<div class="fr"><div><label class="f">Fabric (optional)</label><input class="i" id="pf" placeholder="100% cotton" value="${esc(p.fabric)}"></div><div><label class="f">Fit (optional)</label><input class="i" id="pt" placeholder="Regular fit" value="${esc(p.fit)}"></div></div>
<label class="f">Care (optional)</label><input class="i" id="pw" placeholder="Machine wash cold, do not bleach" value="${esc(p.care)}">
<label class="f">Extra note / notice (optional, shows in a highlighted box)</label><textarea class="i" id="pk" rows="2" placeholder="e.g. Model is 5'10 wearing size M. Limited stock.">${esc(p.note)}</textarea>
<label class="f">Images (uploads instantly, max 4)</label><input type="file" accept="image/*" multiple onchange="upl(this)"><div class="up" id="up"></div>
<label class="f"><input type="checkbox" id="px" ${p.out?'checked':''}> Mark as sold out (customer can't buy)</label><label class="f"><input type="checkbox" id="ph" ${p.hide?'checked':''}> Hide from store</label>
<button class="btn w" style="margin-top:16px" onclick="pSave('${id||''}')">Save product</button>${id?`<button class="btn red w" style="margin-top:8px" onclick="pDel('${id}')">Delete product</button>`:''}`);ups()}
function ups(){$('#up').innerHTML=IM.map((u,i)=>`<div><img src="${u}" alt=""><b onclick="IM.splice(${i},1);ups()">×</b></div>`).join('')}
async function upl(inp){for(const f of inp.files){if(IM.length>=4)break;IM.push(await cmp(f));ups()}inp.value=''}
async function pSave(id){const g=x=>$('#'+x).value.trim(),sizes=g('ps').split(',').map(x=>x.split('=')).filter(x=>x[0].trim()).map(x=>({n:x[0].trim(),q:+(x[1]||0)||0}));
if(!g('pn')||!+g('pp'))return toast('Name and price are required');if(!sizes.length)sizes.push({n:'Free',q:0});
const old=id?S.prods.find(x=>x.id==id):{};const o={...old,id:id||undefined,name:g('pn'),cat:g('pc'),price:+g('pp'),old:+g('po')||0,rating:g('pr'),sizes,useColors:$('#pu').checked,colors:g('pl').split(',').map(x=>x.trim()).filter(Boolean),desc:g('pd'),fabric:g('pf'),fit:g('pt'),care:g('pw'),note:g('pk'),imgs:IM,hide:$('#ph').checked,out:$('#px').checked,ts:old.ts||Date.now()};
try{await DB.save('products',o);toast('Saved');shut();S.prods=await DB.prods(300,'');adm()}catch(e){toast('Save failed. Try smaller images.')}}
async function tgl(id){const p=S.prods.find(x=>x.id==id);p.out=!p.out;await DB.save('products',p);adm()}
async function pDel(id){if(!confirm('Delete this product?'))return;await DB.del('products',id);shut();S.prods=await DB.prods(300,'');adm()}
let POL=[];
function setForm(){const s=S.set;POL=(s.policies||[]).map(p=>({...p}));const F=(k,l,t='text')=>`<div><label class="f">${l}</label><input class="i" data-k="${k}" type="${t}" value="${esc(s[k])}"></div>`;
setTimeout(pol,0);return`<div class="box"><b>Top notice bar</b><label class="f"><input type="checkbox" id="noticeOn" ${s.noticeOn?'checked':''}> Show notice</label>${F('notice','Notice text')}</div>
<div class="box"><b>Hero banner</b><div class="fr">${F('heroT','Headline')}${F('heroS','Sub text')}${F('heroBtn','Button text')}</div><label class="f">Banner image (uploads instantly)</label><input type="file" accept="image/*" onchange="hero(this)"><div class="up" id="hp">${s.heroImg?`<div><img src="${s.heroImg}" style="width:160px;height:80px" alt=""></div>`:''}</div></div>
<div class="box"><b>Contact &amp; payment</b><div class="fr">${F('brand','Brand name')}${F('hotline','Hotline number')}${F('whatsapp','WhatsApp (e.g. 8801XXXXXXXXX)')}${F('bkash','bKash number')}${F('nagad','Nagad number')}${F('about','Footer about text')}</div></div>
<div class="box"><b>Delivery charge (৳)</b><div class="fr">${F('dIn','Inside Dhaka','number')}${F('dOut','Outside Dhaka','number')}</div></div>
<div class="box"><b>Social links</b><div class="fr">${F('fb','Facebook link')}${F('ig','Instagram link')}${F('tt','TikTok link')}</div></div>
<div class="box"><b>Policy pages (shown in footer)</b><div id="pol"></div><button class="btn o sm" style="margin-top:8px" onclick="POL.push({t:'New policy',c:''});pol()">+ Add policy</button></div>
<button class="btn w" onclick="saveSet()">Save settings</button>`}
function pol(){const e=$('#pol');if(e)e.innerHTML=POL.map((p,i)=>`<div style="margin-top:10px"><input class="i" value="${esc(p.t)}" oninput="POL[${i}].t=this.value" placeholder="Title"><textarea class="i" rows="3" oninput="POL[${i}].c=this.value" style="margin-top:4px">${esc(p.c)}</textarea><button class="btn o sm" onclick="POL.splice(${i},1);pol()" style="margin-top:4px">Remove</button></div>`).join('')}
async function hero(inp){S.set.heroImg=await cmp(inp.files[0],1600);$('#hp').innerHTML=`<div><img src="${S.set.heroImg}" style="width:160px;height:80px" alt=""></div>`}
async function saveSet(){const s={...S.set};document.querySelectorAll('[data-k]').forEach(e=>s[e.dataset.k]=e.type=='number'?+e.value:e.value.trim());s.noticeOn=$('#noticeOn').checked;s.policies=POL;
try{await DB.setSet(s);S.set=s;toast('Settings saved')}catch(e){toast('Save failed. Hero image may be too big.')}}
boot();
</script></body></html>
