*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Jost,system-ui,sans-serif;color:var(--ink);background:var(--bg);font-size:15px;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
img{display:block;max-width:100%}
.notice{background:var(--ink);color:#fff;text-align:center;padding:9px 12px;font-size:13px;letter-spacing:.06em}
header{position:sticky;top:0;z-index:20;background:#fffffff2;backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0)}
.hd{max-width:1280px;margin:auto;display:flex;align-items:center;gap:12px;padding:12px 16px}
.logo{font-family:'Playfair Display',serif;font-size:26px;letter-spacing:.14em;flex:1;text-align:center;font-weight:600}
.hd .side{flex:1;display:flex;gap:6px}.hd .side.r{justify-content:flex-end}
.ib{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;position:relative;font-size:19px}
.ib:hover{background:var(--soft)}
.badge{position:absolute;top:2px;right:0;background:var(--gold);color:#fff;font-size:10px;min-width:17px;height:17px;border-radius:9px;display:grid;place-items:center}
.sb{display:none;max-width:1280px;margin:auto;padding:0 16px 12px}.sb.on{display:block}
.sb input{width:100%;padding:11px 14px;border:1px solid var(--line);border-radius:4px;background:var(--soft)}
.hero{position:relative;min-height:56vh;max-height:620px;background:var(--soft) center/cover;display:flex;align-items:flex-end}
.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 40%,#0006)}
.hero div{position:relative;z-index:1;color:#fff;padding:32px clamp(16px,5vw,64px);max-width:640px}
.hero h1{font-family:'Playfair Display',serif;font-size:clamp(30px,6vw,58px);font-weight:500;line-height:1.1}
.hero p{margin:10px 0 18px;font-weight:300;font-size:17px}
.btn{background:var(--ink);color:#fff;padding:13px 26px;font-weight:500;letter-spacing:.04em;border-radius:2px;transition:.2s}
.btn:hover{background:var(--gold)}.btn.o{background:none;color:var(--ink);border:1px solid var(--ink)}.btn.o:hover{background:var(--ink);color:#fff}
.btn.w{width:100%}.btn.sm{padding:8px 14px;font-size:13px}.btn.red{background:var(--red)}
.wrap{max-width:1280px;margin:auto;padding:0 16px}
.cats{display:flex;gap:8px;overflow-x:auto;padding:22px 0 8px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cats button{white-space:nowrap;padding:9px 20px;border:1px solid var(--line);border-radius:30px;font-size:14px;transition:.15s}
.cats button.on,.cats button:hover{background:var(--ink);color:#fff;border-color:var(--ink)}
h2.t{font-family:'Playfair Display',serif;font-weight:500;font-size:26px;margin:22px 0 14px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:22px 12px}
@media(min-width:700px){.grid{grid-template-columns:repeat(3,1fr);gap:28px 16px}}
@media(min-width:1050px){.grid{grid-template-columns:repeat(4,1fr)}}
.card{cursor:pointer}
.card .im{aspect-ratio:3/4;background:var(--soft);overflow:hidden;position:relative}
.card img{width:100%;height:100%;object-fit:cover;transition:.4s}
.card .im img+img{position:absolute;inset:0;opacity:0}
.card:hover .im img+img{opacity:1}
.card h3{font-weight:400;font-size:14px;margin-top:10px;text-transform:uppercase;letter-spacing:.03em;color:#4a4740}
.pr{margin-top:4px;font-weight:500}.pr s{color:var(--mute);font-weight:300;margin-left:6px;font-size:13px}
.rt{font-size:12px;color:var(--gold);margin-top:2px}
.tag{position:absolute;top:8px;left:8px;background:#fff;font-size:11px;padding:3px 8px;letter-spacing:.05em;z-index:1}
.empty{padding:60px 16px;text-align:center;color:var(--mute);grid-column:1/-1}
footer{background:var(--soft);margin-top:70px;padding:44px 16px 90px;border-top:1px solid var(--line)}
.fg{max-width:1280px;margin:auto;display:grid;gap:30px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
footer h4{font-family:'Playfair Display',serif;font-weight:500;margin-bottom:12px;font-size:18px}
footer a,footer p{display:block;color:#5b574f;margin:7px 0;font-size:14px;text-decoration:none;cursor:pointer}
footer a:hover{color:var(--gold)}
.copy{max-width:1280px;margin:30px auto 0;padding-top:18px;border-top:1px solid var(--line);color:var(--mute);font-size:13px;text-align:center}
.float{position:fixed;right:14px;bottom:calc(16px + env(safe-area-inset-bottom,0));z-index:15;background:#25d366;color:#fff;border-radius:30px;padding:12px 18px;font-weight:500;box-shadow:0 6px 18px #0003;text-decoration:none}
#ov{position:fixed;inset:0;background:#0007;z-index:40;display:none}#ov.on{display:block}
#sh{position:fixed;z-index:41;background:#fff;display:none;overflow:auto;bottom:0;left:0;right:0;max-height:92vh;border-radius:14px 14px 0 0;padding:20px 18px calc(24px + env(safe-area-inset-bottom,0));animation:up .25s}
#sh.on{display:block}
@media(min-width:800px){#sh{left:50%;right:auto;bottom:auto;top:50%;transform:translate(-50%,-50%);width:min(880px,94vw);border-radius:8px;animation:none}#sh.n{width:min(480px,94vw)}}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.x{position:absolute;top:10px;right:12px;font-size:26px;width:36px;height:36px}
.pd{display:grid;gap:20px}@media(min-width:800px){.pd{grid-template-columns:1fr 1fr}}
.pd .main{aspect-ratio:3/4;width:100%;object-fit:cover;background:var(--soft)}
.th{display:flex;gap:8px;margin-top:8px;overflow-x:auto}.th img{width:56px;height:72px;object-fit:cover;cursor:pointer;border:1px solid var(--line)}
.opt{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 16px}
.opt button{min-width:46px;padding:9px 14px;border:1px solid var(--line);border-radius:2px}
.opt button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.opt button:disabled{color:#bbb;text-decoration:line-through;cursor:not-allowed}
.lb{font-size:13px;color:var(--mute);margin-top:4px}
.ci{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.ci img{width:64px;height:84px;object-fit:cover}.ci div{flex:1;font-size:14px}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line);margin-top:6px}.qty button{width:30px;height:30px}.qty span{min-width:28px;text-align:center}
.row{display:flex;justify-content:space-between;padding:6px 0}.row.b{font-weight:600;font-size:18px;border-top:1px solid var(--ink);margin-top:8px;padding-top:12px}
.f{display:block;margin:12px 0 4px;font-size:13px;color:var(--mute)}
input.i,select.i,textarea.i{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:3px;background:#fff}
input.i:focus,textarea.i:focus,select.i:focus{outline:2px solid var(--gold);outline-offset:-1px}
.zone{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.zone label{border:1px solid var(--line);padding:12px;border-radius:3px;cursor:pointer;font-size:14px}
.zone input{display:none}.zone label:has(input:checked){border-color:var(--ink);background:var(--soft)}
.toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 20px;border-radius:30px;z-index:60;font-size:14px}
/* admin */
.ad{max-width:1100px;margin:auto;padding:16px 16px 80px}
.tabs{display:flex;gap:6px;overflow-x:auto;margin:14px 0;border-bottom:1px solid var(--line)}
.tabs button{padding:11px 18px;white-space:nowrap;color:var(--mute)}.tabs button.on{color:var(--ink);border-bottom:2px solid var(--ink);font-weight:500}
.al{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.al img{width:48px;height:62px;object-fit:cover;background:var(--soft)}.al .g{flex:1;font-size:14px;min-width:0}
.al .g small{color:var(--mute);display:block}
.pill{display:inline-block;padding:2px 9px;border-radius:12px;font-size:12px;background:var(--soft)}
.pill.g1{background:#e3f4e6;color:#1f7a34}.pill.r1{background:#fbe4e1;color:var(--red)}.pill.y{background:#fdf2d9;color:#8a6410}
.fr{display:grid;gap:0 14px}@media(min-width:700px){.fr{grid-template-columns:1fr 1fr}}
.up{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}.up div{position:relative}.up img{width:70px;height:90px;object-fit:cover;border:1px solid var(--line)}

.box{background:var(--soft);padding:16px;border-radius:6px;margin:14px 0}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}.stats div{background:var(--soft);padding:14px;border-radius:6px}.stats b{font-size:24px;display:block}

#splash{position:fixed;inset:0;z-index:100;background:#fff;display:grid;place-items:center;transition:opacity .6s,visibility .6s;cursor:pointer}

#splash .lg{position:relative;width:min(78vw,440px);aspect-ratio:1060/680}

async function addCat(){const n=$('#nc').value.trim();if(!n)return;if(S.cats.length>=MAXC)return toast('Category limit reached (120)');await DB.save('cats',{name:n});S.cats=await DB.list('cats');adm()}

async function upl(inp){for(const f of inp.files){if(IM.length>=4)break;IM.push(await cmp(f));ups()}inp.value=''}
async function pSave(id){const g=x=>$('#'+x).value.trim(),sizes=g('ps').split(',').map(x=>x.split('=')).filter(x=>x[0].trim()).map(x=>({n:x[0].trim(),q:+(x[1]||0)||0}));
if(!g('pn')||!+g('pp'))return toast('Name and price are required');if(!sizes.length)sizes.push({n:'Free',q:0});
const old=id?S.prods.find(x=>x.id==id):{};const o={...old,id:id||undefined,name:g('pn'),cat:g('pc'),price:+g('pp'),old:+g('po')||0,rating:g('pr'),sizes,useColors:$('#pu').checked,colors:g('pl').split(',').map(x=>x.trim()).filter(Boolean),desc:g('pd'),imgs:IM,hide:$('#ph').checked,out:$('#px').checked,ts:old.ts||Date.now()};
try{await DB.save('products',o);toast('Saved');shut();S.prods=await DB.prods(300,'');adm()}catch(e){toast('Save failed. Try smaller images.')}}
async function tgl(id){const p=S.prods.find(x=>x.id==id);p.out=!p.out;await DB.save('products',p);adm()}
async function pDel(id){if(!confirm('Delete this product?'))return;await DB.del('products',id);shut();S.prods=await DB.prods(300,'');adm()}
let POL=[];
function setForm(){const s=S.set;POL=(s.policies||[]).map(p=>({...p}));const F=(k,l,t='text')=>`<div><label class="f">${l}</label><input class="i" data-k="${k}" type="${t}" value="${esc(s[k])}"></div>`;
setTimeout(pol,0);return`<div class="box"><b>Top notice bar</b><label class="f"><input type="checkbox" id="noticeOn" ${s.noticeOn?'checked':''}> Show notice</label>${F('notice','Notice text')}</div>
<div class="box"><b>Hero banner</b><div class="fr">${F('heroT','Headline')}${F('heroS','Sub text')}${F('heroBtn','Button text')}</div><label class="f">Banner image (uploads instantly)</label><input type="file" accept="image/*" onchange="hero(this)"><div class="up" id="hp">${s.heroImg?`<div><img src="${s.heroImg}" style="width:160px;height:80px" alt=""></div>`:''}</div></div>
<div class="box"><b>Contact &amp; payment</b><div class="fr">${F('brand','Brand name')}${F('hotline','Hotline number')}${F('whatsapp','WhatsApp (e.g. 8801XXXXXXXXX)')}${F('bkash','bKash number')}${F('nagad','Nagad number')}${F('about','Footer about text')}</div></div>
<div class="box"><b>Delivery charge (৳)</b><div class="fr">${F('dIn','Inside Dhaka','number')}${F('dOut','Outside Dhaka','number')}</div></div>
<div class="box"><b>Social links</b><div class="fr">${F('fb','Facebook link')}${F('ig','Instagram link')}${F('tt','TikTok link')}</div></div>
<div class="box"><b>Policy pages (shown in footer)</b><div id="pol"></div><button class="btn o sm" style="margin-top:8px" onclick="POL.push({t:'New policy',c:''});pol()">+ Add policy</button></div>
<button class="btn w" onclick="saveSet()">Save settings</button>`}
function pol(){const e=$('#pol');if(e)e.innerHTML=POL.map((p,i)=>`<div style="margin-top:10px"><input class="i" value="${esc(p.t)}" oninput="POL[${i}].t=this.value" placeholder="Title"><textarea class="i" rows="3" oninput="POL[${i}].c=this.value" style="margin-top:4px">${esc(p.c)}</textarea><button class="btn o sm" onclick="POL.splice(${i},1);pol()" style="margin-top:4px">Remove</button></div>`).join('')}
async function hero(inp){S.set.heroImg=await cmp(inp.files[0],1600);$('#hp').innerHTML=`<div><img src="${S.set.heroImg}" style="width:160px;height:80px" alt=""></div>`}
async function saveSet(){const s={...S.set};document.querySelectorAll('[data-k]').forEach(e=>s[e.dataset.k]=e.type=='number'?+e.value:e.value.trim());s.noticeOn=$('#noticeOn').checked;s.policies=POL;
try{await DB.setSet(s);S.set=s;toast('Settings saved')}catch(e){toast('Save failed. Hero image may be too big.')}}
boot();
</script></body></html>
